name: Verify source fold synchronization
on:
  push:
    branches: ['verify/source-fold']
permissions:
  contents: read
jobs:
  fold:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test tests/ui/fold-placeholder.spec.js tests/ui/workspace.spec.js --grep "fold placeholder|outline sections fold"
