name: CSV keyboard focused checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  csv:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:ui -- tests/ui/csv-keyboard-range.spec.js tests/ui/csv-direct-interaction.spec.js tests/ui/csv-selection.spec.js
