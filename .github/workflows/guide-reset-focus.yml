name: Focus guide reopening
on:
  push:
    branches: ['verify/guide-reset']
permissions:
  contents: read
jobs:
  guide:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/welcome.test.js
      - run: npx playwright install chromium
      - run: npx playwright test tests/ui/welcome-reset.spec.js
