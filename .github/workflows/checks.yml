name: Build and check
on:
  workflow_dispatch:
    inputs:
      startup_baseline_run:
        description: 'Optional successful baseline Actions run ID for a web startup comparison'
        required: false
        type: string
  push:
  pull_request:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
jobs:
  checks:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check:version
      - run: npm test
      - run: node --test tests/tab-host-queue.node.mjs
      - run: dotnet run --project tests/native/NativeChecks.csproj -c Release
      - run: dotnet run --project tests/tab-transfers/TabTransferChecks.csproj -c Release
      - run: npx playwright install chromium
      - name: Publish Windows application
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $publishExitCode = 1
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            & npm run publish:win
            $publishExitCode = $LASTEXITCODE
            if ($publishExitCode -eq 0) { break }
            if ($attempt -lt 4) {
              Write-Warning "Windows publish failed (exit $publishExitCode); retrying in 10 seconds ($attempt/4)."
              Start-Sleep -Seconds 10
            }
          }
          if ($publishExitCode -ne 0) { exit $publishExitCode }
      - name: Verify the production web bundle
        run: node scripts/check-production.mjs
      - run: choco install nsis --yes --no-progress
      - name: Check installer directory validation on Windows
        shell: pwsh
        run: |
          $makeNsisPath = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          & ./tests/installer/Run-DirectoryChecks.ps1 -MakeNsis $makeNsisPath
      # Cache only the original CAB, never extracted executables. The packaging
      # script validates the CAB size and SHA-256 against installer/runtime.json.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: release/runtime-cache/runtime.cab
          key: webview2-fixed-${{ runner.os }}-${{ hashFiles('installer/runtime.json') }}
      - name: Package complete offline setup
        id: package
        shell: pwsh
        run: |
          $env:MAKENSIS = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          python scripts/package-installer.py
      - name: Verify window placement across restarts in real WebView2
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: powershell
        run: |
          & ./tests/installer/Run-WindowPlacementWebView2.ps1 -Payload 'release/MD-Split'
      - name: Verify tab transfers in real WebView2
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: powershell
        run: |
          & ./tests/installer/Run-TabDragWebView2.ps1 -Payload 'release/MD-Split'
      - name: Verify session restoration in real WebView2
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: powershell
        run: |
          & ./tests/installer/Run-SessionWebView2.ps1 -Payload 'release/MD-Split'
      - name: Verify Japanese setup text in the actual wizard
        shell: powershell
        run: |
          $setups = @(Get-ChildItem -LiteralPath release -Filter 'MD-Split-*-Setup.exe' -File)
          if ($setups.Count -ne 1) { throw 'Expected exactly one setup executable.' }
          & ./tests/installer/Check-SetupJapanese.ps1 -Setup $setups[0].FullName
      - name: Smoke test install, repair and uninstall on Windows
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem -LiteralPath release -Filter 'MD-Split-*-Setup.exe' -File)
          if ($setups.Count -ne 1) { throw 'Expected exactly one setup executable.' }
          & ./tests/installer/Run-SetupSmoke.ps1 -Setup $setups[0].FullName
      - name: Obtain verified v1.0.2 for upgrade test
        shell: pwsh
        run: |
          $old = Join-Path $env:RUNNER_TEMP 'MD-Split-1.0.2-Setup.exe'
          Invoke-WebRequest -Uri 'https://github.com/Ptcr8-tool/md-csv_split_viewer/releases/download/v1.0.2/MD-Split-1.0.2-Setup.exe' -OutFile $old -MaximumRetryCount 5 -RetryIntervalSec 10
          if ((Get-FileHash -LiteralPath $old -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'd48c52d9292e479fca431674a68af1b9f80978694bc8b32ac8aaed19a2609a8d') { throw 'Published v1.0.2 setup hash mismatch.' }
      - name: Verify upgrade from v1.0.2 and preservation of user data
        shell: powershell
        run: |
          $setups = @(Get-ChildItem -LiteralPath release -Filter 'MD-Split-*-Setup.exe' -File)
          if ($setups.Count -ne 1) { throw 'Expected exactly one setup executable.' }
          & ./tests/installer/Run-UpgradeV102Smoke.ps1 -OldSetup (Join-Path $env:RUNNER_TEMP 'MD-Split-1.0.2-Setup.exe') -NewSetup $setups[0].FullName
      - name: Obtain verified v1.0.3 for upgrade test
        shell: pwsh
        run: |
          $old = Join-Path $env:RUNNER_TEMP 'MD-Split-1.0.3-Setup.exe'
          Invoke-WebRequest -Uri 'https://github.com/Ptcr8-tool/md-csv_split_viewer/releases/download/v1.0.3/MD-Split-1.0.3-Setup.exe' -OutFile $old -MaximumRetryCount 5 -RetryIntervalSec 10
          if ((Get-FileHash -LiteralPath $old -Algorithm SHA256).Hash.ToLowerInvariant() -cne '172cf4a064cbdd3016241403d64762ad6ea3a420560c85ad5df639873a5aa24a') { throw 'Published v1.0.3 setup hash mismatch.' }
      - name: Verify upgrade from v1.0.3 and preservation of user data
        shell: powershell
        run: |
          $setups = @(Get-ChildItem -LiteralPath release -Filter 'MD-Split-*-Setup.exe' -File)
          if ($setups.Count -ne 1) { throw 'Expected exactly one setup executable.' }
          & ./tests/installer/Run-UpgradeV102Smoke.ps1 -OldSetup (Join-Path $env:RUNNER_TEMP 'MD-Split-1.0.3-Setup.exe') -OldVersion '1.0.3' -NewSetup $setups[0].FullName
      - name: Obtain verified v1.1.0 for upgrade test
        shell: pwsh
        run: |
          $old = Join-Path $env:RUNNER_TEMP 'MD-Split-1.1.0-Setup.exe'
          Invoke-WebRequest -Uri 'https://github.com/Ptcr8-tool/md-csv_split_viewer/releases/download/v1.1.0/MD-Split-1.1.0-Setup.exe' -OutFile $old -MaximumRetryCount 5 -RetryIntervalSec 10
          if ((Get-FileHash -LiteralPath $old -Algorithm SHA256).Hash.ToLowerInvariant() -cne '882eb35b0d7bf89d59c45eeac7cccc0e5a31199d9015b6acd6617ddc3c90da30') { throw 'Published v1.1.0 setup hash mismatch.' }
      - name: Verify upgrade from v1.1.0 and preservation of user data
        shell: powershell
        run: |
          $setups = @(Get-ChildItem -LiteralPath release -Filter 'MD-Split-*-Setup.exe' -File)
          if ($setups.Count -ne 1) { throw 'Expected exactly one setup executable.' }
          & ./tests/installer/Run-UpgradeV102Smoke.ps1 -OldSetup (Join-Path $env:RUNNER_TEMP 'MD-Split-1.1.0-Setup.exe') -OldVersion '1.1.0' -NewSetup $setups[0].FullName
      # Optional comparison uses the same executable and profile with the
      # baseline and candidate web bundles. It does not compare native changes.
      - name: Compare Windows startup against baseline
        if: github.event_name == 'workflow_dispatch' && inputs.startup_baseline_run != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN_ID: ${{ inputs.startup_baseline_run }}
        run: |
          if ($env:BASELINE_RUN_ID -notmatch '^\d+$') { throw 'Expected a numeric baseline run ID.' }
          gh run download $env:BASELINE_RUN_ID --repo '${{ github.repository }}' --name MD-Split-Windows-setup --dir baseline-startup
          if ($LASTEXITCODE -ne 0) { throw 'Could not obtain baseline setup.' }
          $baselines = @(Get-ChildItem -LiteralPath baseline-startup -Filter 'MD-Split-*-Setup.exe' -File)
          if ($baselines.Count -ne 1) { throw 'Expected exactly one baseline setup.' }
          & ./tests/installer/Measure-Startup.ps1 -BaselineSetup $baselines[0].FullName -CandidateWeb 'dist'
      - name: Verify CSV clipboard in real WebView2
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: powershell
        run: |
          & ./tests/installer/Run-CsvClipboardWebView2.ps1 -Payload 'release/MD-Split'
      - name: Verify both print dialogs in real WebView2
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: powershell
        run: |
          & ./tests/installer/Run-PrintWebView2.ps1 -Payload 'release/MD-Split'
      - name: Verify mixed line endings in real WebView2
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: powershell
        run: |
          & ./tests/installer/Run-LineEndingsWebView2.ps1 -Payload 'release/MD-Split'
      - name: Verify optional startup trace in real WebView2
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: powershell
        run: |
          & ./tests/installer/Run-StartupTraceWebView2.ps1 -Payload 'release/MD-Split'
      - name: Verify binary viewer navigation in Windows
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: powershell
        run: |
          & ./tests/installer/Run-BinaryViewer.ps1 -Payload 'release/MD-Split'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MD-Split-Windows-setup
          path: |
            release/MD-Split-*-Setup.exe
            release/SHA256SUMS.txt
          if-no-files-found: error





  browser-ui:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:ui
