name: Binary viewer diagnostics
on:
  push:
    branches: [work/windows-context-and-new]
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run publish:win
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: release/runtime-cache/runtime.cab
          key: webview2-fixed-${{ runner.os }}-${{ hashFiles('installer/runtime.json') }}
      - name: Prepare fixed WebView runtime
        shell: pwsh
        run: |
          $runtime = Get-Content installer/runtime.json -Raw | ConvertFrom-Json
          if (-not $runtime.url.StartsWith('https://msedge.sf.dl.delivery.mp.microsoft.com/', [StringComparison]::Ordinal)) { throw 'Unexpected runtime host.' }
          $cache = Join-Path $PWD 'release/runtime-cache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $cab = Join-Path $cache 'runtime.cab'
          if ((Test-Path -LiteralPath $cab) -and ((Get-Item -LiteralPath $cab).Length -ne $runtime.bytes -or (Get-FileHash -LiteralPath $cab -Algorithm SHA256).Hash -ne $runtime.sha256)) { Remove-Item -LiteralPath $cab -Force }
          if (-not (Test-Path -LiteralPath $cab)) { Invoke-WebRequest -Uri $runtime.url -OutFile $cab }
          if ((Get-Item -LiteralPath $cab).Length -ne $runtime.bytes -or (Get-FileHash -LiteralPath $cab -Algorithm SHA256).Hash -ne $runtime.sha256) { throw 'Runtime checksum mismatch.' }
          $extracted = Join-Path $cache 'extracted'
          New-Item -ItemType Directory -Force -Path $extracted | Out-Null
          & "$env:SystemRoot/System32/expand.exe" '-F:*' $cab $extracted
          if ($LASTEXITCODE -ne 0) { throw 'Runtime extraction failed.' }
          $matches = @(Get-ChildItem -LiteralPath $extracted -Filter msedgewebview2.exe -Recurse -File)
          if ($matches.Count -ne 1) { throw 'Unexpected fixed runtime layout.' }
          Copy-Item -LiteralPath $matches[0].DirectoryName -Destination 'release/MD-Split/WebView2Runtime' -Recurse
      - name: Verify binary viewer navigation
        shell: powershell
        run: |
          & ./tests/installer/Run-BinaryViewer.ps1 -Payload 'release/MD-Split'
