name: Compare native startup
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/startup-compare.yml'
      - 'tests/installer/Measure-NativeStartup.ps1'
      - 'native/StartupTrace.cs'

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run build
      - name: Publish normal and ReadyToRun builds
        shell: pwsh
        run: |
          dotnet publish native/MdSplit.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=false -o release/startup-normal
          if ($LASTEXITCODE -ne 0) { throw 'Normal publish failed.' }
          dotnet clean native/MdSplit.csproj -c Release -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Clean between publishes failed.' }
          dotnet publish native/MdSplit.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o release/startup-r2r
          if ($LASTEXITCODE -ne 0) { throw 'ReadyToRun publish failed.' }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: release/runtime-cache/runtime.cab
          key: webview2-fixed-${{ runner.os }}-${{ hashFiles('installer/runtime.json') }}
      - name: Prepare verified fixed WebView2 runtime
        shell: pwsh
        run: |
          $runtime = Get-Content installer/runtime.json -Raw | ConvertFrom-Json
          if (-not $runtime.url.StartsWith('https://msedge.sf.dl.delivery.mp.microsoft.com/', [StringComparison]::Ordinal)) { throw 'Unexpected runtime download host.' }
          $cache = Join-Path $PWD 'release/runtime-cache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $cab = Join-Path $cache 'runtime.cab'
          if ((Test-Path -LiteralPath $cab) -and ((Get-Item -LiteralPath $cab).Length -ne $runtime.bytes -or (Get-FileHash -LiteralPath $cab -Algorithm SHA256).Hash -ne $runtime.sha256)) { Remove-Item -LiteralPath $cab -Force }
          if (-not (Test-Path -LiteralPath $cab)) { Invoke-WebRequest -Uri $runtime.url -OutFile $cab }
          if ((Get-Item -LiteralPath $cab).Length -ne $runtime.bytes -or (Get-FileHash -LiteralPath $cab -Algorithm SHA256).Hash -ne $runtime.sha256) { throw 'Fixed runtime size or checksum mismatch.' }
          $extracted = Join-Path $cache 'extracted'
          New-Item -ItemType Directory -Force -Path $extracted | Out-Null
          & "$env:SystemRoot/System32/expand.exe" '-F:*' $cab $extracted
          if ($LASTEXITCODE -ne 0) { throw 'Fixed runtime extraction failed.' }
          $matches = @(Get-ChildItem -LiteralPath $extracted -Filter msedgewebview2.exe -Recurse -File)
          if ($matches.Count -ne 1) { throw 'Unexpected fixed runtime layout.' }
          "MDSPLIT_COMPARISON_RUNTIME=$($matches[0].DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Measure isolated native startup
        shell: pwsh
        run: |
          & ./tests/installer/Measure-NativeStartup.ps1 -NormalPayload 'release/startup-normal' -ReadyToRunPayload 'release/startup-r2r' -Runtime $env:MDSPLIT_COMPARISON_RUNTIME -ReportPath 'release/native-startup-comparison.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-startup-comparison
          path: release/native-startup-comparison.json
          if-no-files-found: error
