name: Probe Mermaid and source blank lines
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/ui/mermaid-scroll.spec.js tests/ui/mermaid-height.spec.js tests/ui/source-blank-line-input.spec.js tests/ui/image-scroll.spec.js
