name: Diagnose Windows Shell icon resolution
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/diagnose-shell-icons.yml'
      - 'tests/installer/Diagnose-ShellIcons.ps1'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-shell-icons.yml'
      - 'tests/installer/Diagnose-ShellIcons.ps1'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare Shell and direct icon pixels
        shell: powershell
        run: ./tests/installer/Diagnose-ShellIcons.ps1
      - name: Save synthetic diagnostic images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shell-icon-diagnostics
          path: shell-icon-diagnostics/*.png
          if-no-files-found: warn
