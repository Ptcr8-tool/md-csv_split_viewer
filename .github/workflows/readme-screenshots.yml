name: Generate README screenshots
on:
  push:
    branches: ['docs/readme-refresh-v103']
    paths:
      - tests/ui/readme-screenshots.spec.js
      - .github/workflows/readme-screenshots.yml
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test tests/ui/readme-screenshots.spec.js --reporter=list
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: readme-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
